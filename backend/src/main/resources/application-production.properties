server.port=${PORT:${SERVER_PORT:18081}}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
debug=false
logging.level.root=INFO
# The existing Aiven database has already been migrated. Keep deployments read-only for schema setup.
app.schema.initializer.enabled=false
app.cors.allowed-origins=https://deploy-web-qladpm.vercel.app
