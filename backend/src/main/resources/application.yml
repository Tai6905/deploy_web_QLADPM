server:
  port: ${SERVER_PORT:18081}

spring:
  config:
    import: optional:file:./application-local.properties,optional:file:./backend/application-local.properties
  application:
    name: modern-shop-flow-catalog-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://qldapm-261-hcmut-ltw.e.aivencloud.com:28028/defaultdb?sslmode=require&connectTimeout=10&socketTimeout=30&tcpKeepAlive=true}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  bootstrap:
    owner:
      email: ${BOOTSTRAP_OWNER_EMAIL:}
      password: ${BOOTSTRAP_OWNER_PASSWORD:}
      display-name: ${BOOTSTRAP_OWNER_DISPLAY_NAME:Shop Owner}
    warehouse:
      email: ${BOOTSTRAP_WAREHOUSE_EMAIL:}
      password: ${BOOTSTRAP_WAREHOUSE_PASSWORD:}
      display-name: ${BOOTSTRAP_WAREHOUSE_DISPLAY_NAME:Warehouse Staff}

management:
  endpoints:
    web:
      exposure:
        include: health,info
